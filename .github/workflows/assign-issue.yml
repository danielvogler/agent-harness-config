name: assign-issue

# An unassigned issue is one nobody feels responsible for and it is easy to lose
# next to the ones people are already watching. Assigning it to whoever opened it
# gives every issue an owner from the first minute; reassign from there if someone
# else should run with it.

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  assign:
    runs-on: ubuntu-latest
    steps:
      - name: Assign the reporter
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              assignees: [context.payload.issue.user.login],
            });
