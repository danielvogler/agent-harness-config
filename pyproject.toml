# Packaging for one thing only: pre-commit installs this repo as a hook repository with
# pip, and the repo-conformance and auto-release hooks in .pre-commit-hooks.yaml need their entry points.
# Installing the shared config does not use it; ruff.toml and pytest.ini keep their settings.
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-harness-hooks"
version = "0"
requires-python = ">=3.10"

[project.scripts]
repo-conformance = "repo_conformance:main"
auto-release = "auto_release:main"

# Only the hook module ships. An explicit list keeps setuptools from discovering
# custom/, overlay/ and the other top-level folders as packages.
[tool.setuptools]
package-dir = { "" = "tools" }
py-modules = ["repo_conformance", "auto_release"]
