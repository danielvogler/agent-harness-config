<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="ht hd">
  <title id="ht">How agent-harness-config works</title>
  <desc id="hd">What you get: skills (54 of the team's own plus ECC's), 7 rules of our own plus ECC's, ECC's commands plus our research command, agents from ECC, 2 guard hooks, and 5 MCP servers: context7, BigQuery, Miro, Jira with Confluence, and GitHub. make install puts skills, rules, commands, agents and hooks in place; make setup-user turns on the permissions and the two hooks; make mcp connects the MCP servers to Claude Code. Claude Code, Codex and opencode install into the home directory, Cursor and Antigravity per project. Skills reach all five harnesses; agents all but opencode; commands all but Codex; rules Claude Code, Cursor and Antigravity; hooks Claude Code, Cursor and opencode; MCP servers Claude Code. Everything is built from a pinned ECC commit plus this repo's overlay.</desc>
  <rect width="1200" height="560" fill="#0E0E10"/>
  <rect y="559" width="1200" height="1" fill="#2A2A2C"/>
  <g font-family="Inter, ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
    <circle cx="44" cy="48" r="4" fill="#5FBFA6"/>
    <text x="60" y="53" font-size="13" font-weight="600" letter-spacing="2.2" fill="#A3A39D">HOW IT WORKS</text>
    <text x="40" y="104" font-size="36" font-weight="700" letter-spacing="-1.4" fill="#FDFDFB">One install, every harness.</text>
    <text x="40" y="152" font-size="10.5" font-weight="700" letter-spacing="1.4" fill="#A3A39D">WHAT YOU GET</text>
    <rect x="40" y="166" width="178" height="80" rx="12" fill="#161618" stroke="#2A2A2C" stroke-width="1"/>
    <text x="56" y="194" font-size="16" font-weight="700" fill="#FDFDFB">Skills</text>
    <text x="56" y="216" font-size="12" fill="#A3A39D">54 of ours, plus ECC's</text>
    <text x="56" y="232" font-size="12" fill="#A3A39D">loaded only when needed</text>
    <rect x="230" y="166" width="178" height="80" rx="12" fill="#161618" stroke="#2A2A2C" stroke-width="1"/>
    <text x="246" y="194" font-size="16" font-weight="700" fill="#FDFDFB">Rules</text>
    <text x="246" y="216" font-size="12" fill="#A3A39D">7 of ours, plus ECC's</text>
    <text x="246" y="232" font-size="12" fill="#A3A39D">always in context</text>
    <rect x="40" y="258" width="178" height="80" rx="12" fill="#161618" stroke="#2A2A2C" stroke-width="1"/>
    <text x="56" y="286" font-size="16" font-weight="700" fill="#FDFDFB">Commands</text>
    <text x="56" y="308" font-size="12" fill="#A3A39D">ECC's, plus our own</text>
    <text x="56" y="324" font-size="12" fill="#A3A39D">/agent-frameworks</text>
    <rect x="230" y="258" width="178" height="80" rx="12" fill="#161618" stroke="#2A2A2C" stroke-width="1"/>
    <text x="246" y="286" font-size="16" font-weight="700" fill="#FDFDFB">Agents</text>
    <text x="246" y="308" font-size="12" fill="#A3A39D">reviewers, planners,</text>
    <text x="246" y="324" font-size="12" fill="#A3A39D">build fixers, from ECC</text>
    <rect x="40" y="350" width="178" height="80" rx="12" fill="#161618" stroke="#2A2A2C" stroke-width="1"/>
    <text x="56" y="378" font-size="16" font-weight="700" fill="#FDFDFB">Hooks</text>
    <text x="56" y="400" font-size="12" fill="#A3A39D">2 guards: no --no-verify,</text>
    <text x="56" y="416" font-size="12" fill="#A3A39D">no editing linter config</text>
    <rect x="230" y="350" width="178" height="80" rx="12" fill="#161618" stroke="#2A2A2C" stroke-width="1"/>
    <text x="246" y="378" font-size="16" font-weight="700" fill="#FDFDFB">MCP servers</text>
    <text x="246" y="400" font-size="12" fill="#A3A39D">context7, BigQuery, Miro,</text>
    <text x="246" y="416" font-size="12" fill="#A3A39D">Jira, Confluence, GitHub</text>
    <text x="40" y="454" font-size="11.5" fill="#6F6F6B">Built from a pinned ECC commit plus our <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">custom/</tspan> and <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">overlay/</tspan>.</text>
