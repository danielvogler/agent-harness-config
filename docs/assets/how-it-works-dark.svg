    <text x="60" y="494" font-size="14" fill="#A3A39D">Codex and opencode have no rules layer, so <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#FDFDFB">make setup-user</tspan> writes the same conventions into their AGENTS.md.</text>
    <text x="60" y="518" font-size="14" fill="#A3A39D">Cursor and Antigravity are project-scoped: install them per project with <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#FDFDFB">make install-project</tspan>.</text>
